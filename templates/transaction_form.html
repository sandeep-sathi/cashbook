{% extends "base.html" %}
{% block title %}{{ 'Edit' if action == 'edit' else 'Add' }} transaction - {{ book['name'] }}{% endblock %}
{% block content %}
    <a class="back-link" href="{{ url_for('ledger', book_id=book['id']) }}">&larr; {{ book['name'] }}</a>
    <h1>{{ 'Edit transaction' if action == 'edit' else ('Add Cash In' if txn.type == 'in' else 'Add Cash Out') }}</h1>

    <form method="post" action="{{ url_for('edit_transaction', book_id=book['id'], txn_id=txn_id) if action == 'edit' else url_for('new_transaction', book_id=book['id']) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <fieldset>
            <div class="type-toggle">
                <label><input type="radio" name="type" value="in" {% if txn.type == 'in' %}checked{% endif %}> Cash In</label>
                <label class="out"><input type="radio" name="type" value="out" {% if txn.type == 'out' %}checked{% endif %}> Cash Out</label>
            </div>
        </fieldset>

        <label>
            Amount
            <input type="text" inputmode="decimal" name="amount" value="{{ txn.amount or '' }}" required placeholder="0.00">
        </label>

        <label>
            Date
            <input type="date" name="date" value="{{ txn.date }}" required>
        </label>

        <label>
            Category
            <input type="text" name="category" value="{{ txn.category or '' }}" list="category-list" maxlength="50" placeholder="Optional">
            <datalist id="category-list">
                {% for c in book_categories %}<option value="{{ c['name'] }}">{% endfor %}
            </datalist>
        </label>

        <label>
            Party Name
            <input type="text" name="party" value="{{ txn.party or '' }}" list="party-list" maxlength="50" placeholder="Optional">
            <datalist id="party-list">
                {% for p in book_parties %}<option value="{{ p['name'] }}">{% endfor %}
            </datalist>
        </label>

        <label>
            Payment Mode
            <select name="payment_mode">
                <option value="">Optional</option>
                {% for value, label in payment_modes %}
                    <option value="{{ value }}" {% if txn.payment_mode == value %}selected{% endif %}>{{ label }}</option>
                {% endfor %}
            </select>
        </label>

        <label>
            Description
            <input type="text" name="description" value="{{ txn.description or '' }}" maxlength="500" placeholder="Optional">
        </label>

        <button type="submit">Save</button>
    </form>
{% endblock %}
