{% extends "base.html" %}
{% block title %}Rename {{ book['name'] }} - Cashbook{% endblock %}
{% block content %}
    <a class="back-link" href="{{ url_for('books') }}">&larr; Books</a>
    <h1>Rename book</h1>

    <form method="post" action="{{ url_for('rename_book', book_id=book['id']) }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            Name
            <input type="text" name="name" value="{{ form_name }}" required autofocus maxlength="100">
        </label>
        <button type="submit">Save</button>
    </form>
{% endblock %}
