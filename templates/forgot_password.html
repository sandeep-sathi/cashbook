{% extends "base.html" %}
{% block title %}Forgot password - Cashbook{% endblock %}
{% block content %}
    <h1>Forgot password</h1>
    <p>Enter your account's email address and we'll send you a link to reset your password.</p>

    <form method="post" action="{{ url_for('forgot_password') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            Email
            <input type="email" name="email" required autofocus maxlength="254">
        </label>
        <button type="submit">Send reset link</button>
    </form>

    <p><a href="{{ url_for('login') }}">Back to log in</a></p>
{% endblock %}
