{% extends "base.html" %}
{% block title %}Sign up - Cashbook{% endblock %}
{% block content %}
    <h1>Sign up</h1>

    <form method="post" action="{{ url_for('signup') }}">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>
            Username
            <input type="text" name="username" value="{{ form_username }}" required autofocus maxlength="50">
        </label>
        <label>
            Email
            <input type="email" name="email" value="{{ form_email }}" required maxlength="254">
        </label>
        <label>
            Password
            <input type="password" name="password" required minlength="8">
        </label>
        <label>
            Confirm password
            <input type="password" name="confirm_password" required minlength="8">
        </label>
        <label>
            Invite code
            <input type="text" name="invite_code" required>
        </label>
        <button type="submit">Create account</button>
    </form>

    <p>Already have an account? <a href="{{ url_for('login') }}">Log in</a></p>
{% endblock %}
